name: Build iOS IPA (Unsigned)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Instalar dependencias
      run: npm install

    - name: Compilar la app web (Vite)
      run: npm run build

    - name: Inicializar Capacitor e iOS
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/ios
        npx cap init FormaApp com.davidgambin.forma --web-dir dist
        npx cap add ios
        npx cap sync ios

    - name: Construir app en Xcode (Unsigned)
      run: |
        cd ios/App
        xcodebuild -workspace App.xcworkspace \
          -scheme App \
          -configuration Release \
          -sdk iphoneos \
          -derivedDataPath derivedData \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Empaquetar a .ipa
      run: |
        cd ios/App/derivedData/Build/Products/Release-iphoneos
        mkdir Payload
        mv App.app Payload/
        zip -r FormaApp.ipa Payload

    - name: Subir .ipa para descargar
      uses: actions/upload-artifact@v4
      with:
        name: FormaApp-IPA
        path: ios/App/derivedData/Build/Products/Release-iphoneos/FormaApp.ipa
