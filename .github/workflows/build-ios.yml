name: Build iOS IPA (Unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias y compilar la web
        run: |
          npm install
          npm run build

      - name: Capacitor iOS
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/ios@7
          npx cap init FormaApp com.davidgambin.forma --web-dir dist
          npx cap add ios
          npx cap sync ios
          ls ios/App

      - name: Compilar sin firmar
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath derivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Empaquetar .ipa
        run: |
          cd ios/App/derivedData/Build/Products/Release-iphoneos
          mkdir Payload
          mv App.app Payload/
          zip -r FormaApp.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: FormaApp-IPA
          path: ios/App/derivedData/Build/Products/Release-iphoneos/FormaApp.ipa
